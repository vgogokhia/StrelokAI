<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; font-family: sans-serif; height: 96px; overflow: hidden; }
  #box { background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%); border: 1px solid #4CAF50;
         border-radius: 8px; padding: 6px 10px; height: 82px; box-sizing: border-box; color: #ddd;
         cursor: pointer; user-select: none; }
  .lbl { font-size: 11px; color: #888; }
  .row { display: flex; justify-content: space-around; margin-top: 2px; }
  .val { font-size: 22px; font-weight: bold; color: #4CAF50; line-height: 1.1; }
  .sub { font-size: 11px; color: #aaa; }
  #hint { font-size: 11px; color: #888; text-align: center; margin-top: 2px; }
</style>
</head>
<body>
<div id="box" onclick="apply()">
  <div class="lbl">📐 PHONE INCLINOMETER — lay the phone along the barrel, screen up, top edge to the target. Tap to apply.</div>
  <div class="row">
    <div><div class="val" id="pitch">---</div><div class="sub">shot angle</div></div>
    <div><div class="val" id="roll">---</div><div class="sub">cant</div></div>
  </div>
  <div id="hint">Initializing...</div>
</div>
<script>
  var pitch = null, roll = null, fired = false;
  function post(type, extra) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra || {}), "*");
  }
  window.addEventListener("message", function (e) {
    if (e.data.type === "streamlit:render") post("streamlit:setFrameHeight", {height: 96});
  });
  post("streamlit:componentReady", {apiVersion: 1});
  post("streamlit:setFrameHeight", {height: 96});

  function onOrient(e) {
    if (e.beta === null || e.beta === undefined) return;
    fired = true;
    // Phone flat, top edge pointing at the target: beta = front/back tilt
    // (+ = top edge raised = uphill), gamma = left/right roll (+ = right side down).
    var b = e.beta, g = e.gamma;
    // If the screen faces down (|beta|>90) the readings flip; normalise.
    if (b > 90) b = 180 - b; if (b < -90) b = -180 - b;
    pitch = Math.round(b * 2) / 2; roll = Math.round(g * 2) / 2;
    document.getElementById("pitch").textContent = (pitch > 0 ? "+" : "") + pitch.toFixed(1) + "°";
    document.getElementById("roll").textContent = (roll > 0 ? "+" : "") + roll.toFixed(1) + "°";
    document.getElementById("hint").textContent = "Hold steady, then tap";
  }
  function start() {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(function (r) {
        if (r === "granted") window.addEventListener("deviceorientation", onOrient);
        else document.getElementById("hint").textContent = "Permission denied";
      }).catch(function () { document.getElementById("hint").textContent = "Tap to enable sensors"; });
    } else if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", onOrient);
    } else {
      document.getElementById("hint").textContent = "No orientation sensor";
    }
    setTimeout(function () { if (!fired) document.getElementById("hint").textContent = "No sensor data (desktop?) — type the angle instead"; }, 1500);
  }
  function apply() {
    if (pitch === null) { start(); return; }
    post("streamlit:setComponentValue", {value: {pitch: pitch, roll: roll, ts: Date.now()}});
    document.getElementById("hint").textContent = "Applied ✓";
  }
  setTimeout(start, 200);
</script>
</body>
</html>
