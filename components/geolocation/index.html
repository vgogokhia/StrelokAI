<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; font-family: sans-serif; height: 44px; overflow: hidden; }
  #btn {
    width: 100%; height: 40px; box-sizing: border-box; cursor: pointer;
    background: #1E1E1E; color: #E0E0E0; border: 1px solid #4CAF50;
    border-radius: 8px; font-size: 14px; user-select: none;
  }
  #btn:hover { background: #2a2a2a; }
  #btn.busy { opacity: 0.6; cursor: wait; }
</style>
</head>
<body>
<button id="btn" onclick="locate()">📍 Use my location</button>
<script>
  function post(type, extra) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra || {}), "*");
  }
  window.addEventListener("message", function (e) {
    if (e.data.type === "streamlit:render") post("streamlit:setFrameHeight", {height: 44});
  });
  post("streamlit:componentReady", {apiVersion: 1});
  post("streamlit:setFrameHeight", {height: 44});

  function locate() {
    var btn = document.getElementById("btn");
    if (!navigator.geolocation) { btn.textContent = "Geolocation not available"; return; }
    btn.classList.add("busy"); btn.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(function (pos) {
      btn.classList.remove("busy"); btn.textContent = "📍 Use my location";
      post("streamlit:setComponentValue", {value: {
        lat: pos.coords.latitude, lon: pos.coords.longitude,
        alt: pos.coords.altitude, ts: Date.now()
      }});
    }, function (err) {
      btn.classList.remove("busy");
      btn.textContent = err.code === 1 ? "Location permission denied" : "Location unavailable";
      setTimeout(function () { btn.textContent = "📍 Use my location"; }, 3000);
    }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 60000});
  }
</script>
</body>
</html>
